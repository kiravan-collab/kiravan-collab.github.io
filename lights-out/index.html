<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>라이트 아웃 · 불을 전부 꺼보세요</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#0e0f16;
    --bg-2:#161826;
    --panel:#1d2032;
    --panel-2:#232739;
    --ink:#f2efe6;
    --ink-dim:#9199b8;
    --line:rgba(255,255,255,0.08);
    --accent:#ffc65c;
    --accent-2:#ff8a5c;
    --off-cell:#262a3d;
    --off-cell-2:#1b1e2c;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100svh;
    background:
      radial-gradient(circle at 20% 0%, #23233c 0%, transparent 55%),
      radial-gradient(circle at 85% 100%, #1c1830 0%, transparent 55%),
      linear-gradient(180deg,var(--bg-1),var(--bg-2));
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:14px 12px calc(14px + env(safe-area-inset-bottom));
    overflow-x:hidden;
    -webkit-user-select:none; user-select:none;
    touch-action:manipulation;
  }

  .wrap{width:100%; max-width:440px; display:flex; flex-direction:column; gap:12px; align-items:center;}

  /* -------- ad slot -------- */
  .ad-slot{
    width:100%;
    display:flex; align-items:center; justify-content:center;
    background:repeating-linear-gradient(135deg, rgba(255,255,255,0.03) 0 10px, rgba(255,255,255,0.015) 10px 20px);
    border:1px dashed rgba(255,255,255,0.18);
    border-radius:10px;
    color:var(--ink-dim);
    font-size:11px;
    letter-spacing:.04em;
  }
  .ad-slot.top{ min-height:50px; max-width:320px; margin:0 auto; }
  .ad-slot.result{ min-height:100px; margin-top:6px; }

  /* -------- header -------- */
  header{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .title{
    font-family:'Baloo 2', system-ui, sans-serif;
    font-weight:800;
    font-size:22px;
    letter-spacing:-0.01em;
    display:flex; align-items:center; gap:8px;
  }
  .title .bulb{
    width:14px;height:14px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff6d8, var(--accent) 60%, var(--accent-2));
    box-shadow:0 0 10px 2px rgba(255,198,92,0.6);
    display:inline-block;
  }
  .stats{ display:flex; gap:8px; }
  .stat{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:6px 10px;
    text-align:center;
    min-width:56px;
  }
  .stat .num{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:15px; line-height:1.1;}
  .stat .lbl{ font-size:9px; color:var(--ink-dim); letter-spacing:.03em; margin-top:1px;}

  /* -------- board -------- */
  .board-card{
    width:100%;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:18px;
    padding:12px;
    box-shadow:0 20px 40px -20px rgba(0,0,0,0.65);
  }
  #board{
    display:grid;
    width:100%;
    aspect-ratio:1/1;
    gap:7px;
    border-radius:10px;
  }
  .cell{
    width:100%; height:100%;
    border:none;
    border-radius:9px;
    cursor:pointer;
    background:var(--off-cell);
    box-shadow:inset 0 2px 4px rgba(0,0,0,0.35), inset 0 -1px 0 rgba(255,255,255,0.03);
    transition:background .22s ease, box-shadow .22s ease, transform .12s ease;
  }
  .cell:active{ transform:scale(0.93); }
  .cell.on{
    background:radial-gradient(circle at 35% 28%, #fff6d8, var(--accent) 55%, var(--accent-2));
    box-shadow:0 0 16px 3px rgba(255,198,92,0.55), inset 0 -3px 6px rgba(0,0,0,0.15);
  }

  .actions{
    width:100%;
    display:flex;
    justify-content:center;
  }
  .ghost-btn{
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--ink-dim);
    font-size:12.5px;
    padding:9px 16px;
    border-radius:12px;
    cursor:pointer;
    display:flex; align-items:center; gap:6px;
  }
  .ghost-btn:active{ transform:scale(0.97); }

  .hint{
    color:var(--ink-dim);
    font-size:12px;
    text-align:center;
    line-height:1.5;
  }

  /* -------- modal -------- */
  .overlay{
    position:fixed; inset:0;
    background:rgba(8,8,14,0.72);
    backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    opacity:0; pointer-events:none;
    transition:opacity .25s ease;
    z-index:50;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .modal{
    width:100%; max-width:360px;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:20px;
    padding:22px 20px 18px;
    text-align:center;
    transform:translateY(12px) scale(0.98);
    transition:transform .25s ease;
  }
  .overlay.show .modal{ transform:translateY(0) scale(1); }
  .modal .big{
    font-family:'Baloo 2',sans-serif;
    font-weight:800;
    font-size:26px;
    margin-bottom:4px;
  }
  .modal .sub{ color:var(--ink-dim); font-size:13px; margin-bottom:16px;}
  .modal .row{ display:flex; gap:8px; margin-bottom:6px; }
  .modal .box{
    flex:1;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:10px 6px;
  }
  .modal .box .num{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:18px;}
  .modal .box .lbl{ font-size:10px; color:var(--ink-dim); margin-top:2px;}
  .btn{
    margin-top:16px;
    width:100%;
    border:none;
    border-radius:14px;
    padding:14px;
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:16px;
    color:#241703;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    cursor:pointer;
    transition:transform .12s ease;
  }
  .btn:active{ transform:scale(0.97); }

  footer{ color:var(--ink-dim); font-size:11px; text-align:center; margin-top:2px; }
</style>
</head>
<body>

<div class="wrap">

  <!-- ============ 광고 영역 (상단 배너) ============ -->
  <div class="ad-slot top">광고 영역 (320×50)</div>

  <header>
    <div class="title"><span class="bulb"></span>라이트 아웃</div>
    <div class="stats">
      <div class="stat"><div class="num" id="statTime">0:00</div><div class="lbl">시간</div></div>
      <div class="stat"><div class="num" id="statBest">-</div><div class="lbl">최고기록</div></div>
    </div>
  </header>

  <div class="board-card">
    <div id="board"></div>
  </div>

  <div class="stats" style="width:100%; justify-content:center;">
    <div class="stat" style="min-width:100px;"><div class="num" id="statMoves">0</div><div class="lbl">누른 횟수</div></div>
  </div>

  <div class="actions">
    <button class="ghost-btn" id="reshuffleBtn">🔀 새로 섞기</button>
  </div>

  <p class="hint">칸을 누르면 그 칸과 상하좌우가 함께 켜지거나 꺼져요.<br>모든 불을 꺼서 보드를 완전히 어둡게 만드세요.</p>

  <footer>한 판 1~3분 · 심심할 때 부담없이</footer>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="big">불 완전 소등!</div>
    <div class="sub" id="resultSub">모든 조명을 껐어요</div>
    <div class="row">
      <div class="box"><div class="num" id="resMoves">0</div><div class="lbl">누른 횟수</div></div>
      <div class="box"><div class="num" id="resTime">0:00</div><div class="lbl">걸린 시간</div></div>
    </div>

    <!-- ============ 광고 영역 (결과 화면) ============ -->
    <div class="ad-slot result">광고 영역 (결과 화면)</div>

    <button class="btn" id="retryBtn">다시 하기</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  // ---------- 설정 ----------
  const SIZE = 5;              // 5x5 보드
  const SCRAMBLE_MOVES = 20;   // 시작 시 풀이가능하도록 섞는 횟수
  const BEST_KEY = 'lightsout_best_moves_v1';

  let grid = [];        // 0/1 상태
  let movesUsed = 0;
  let startTime = 0;
  let timerId = null;
  let ended = false;

  const boardEl = document.getElementById('board');
  const statTimeEl = document.getElementById('statTime');
  const statBestEl = document.getElementById('statBest');
  const statMovesEl = document.getElementById('statMoves');
  const overlayEl = document.getElementById('overlay');
  const resultSubEl = document.getElementById('resultSub');
  const resMovesEl = document.getElementById('resMoves');
  const resTimeEl = document.getElementById('resTime');
  const retryBtn = document.getElementById('retryBtn');
  const reshuffleBtn = document.getElementById('reshuffleBtn');

  const idx = (r,c) => r*SIZE + c;

  function neighborsWithSelf(i){
    const r = Math.floor(i/SIZE), c = i % SIZE;
    const out = [i];
    if(r>0) out.push(idx(r-1,c));
    if(r<SIZE-1) out.push(idx(r+1,c));
    if(c>0) out.push(idx(r,c-1));
    if(c<SIZE-1) out.push(idx(r,c+1));
    return out;
  }

  function toggleAt(i, arr){
    neighborsWithSelf(i).forEach(n => { arr[n] = arr[n] ? 0 : 1; });
  }

  function buildBoardDom(){
    boardEl.innerHTML = '';
    boardEl.style.gridTemplateColumns = `repeat(${SIZE}, 1fr)`;
    boardEl.style.gridTemplateRows = `repeat(${SIZE}, 1fr)`;
    for(let i=0;i<SIZE*SIZE;i++){
      const cell = document.createElement('button');
      cell.className = 'cell';
      cell.addEventListener('click', () => onTap(i));
      boardEl.appendChild(cell);
    }
  }

  function paint(){
    const cells = boardEl.children;
    for(let i=0;i<grid.length;i++){
      cells[i].classList.toggle('on', grid[i] === 1);
    }
  }

  function fmtTime(sec){
    const m = Math.floor(sec/60);
    const s = sec % 60;
    return m + ':' + String(s).padStart(2,'0');
  }

  function tickTimer(){
    if(ended) return;
    const sec = Math.floor((Date.now()-startTime)/1000);
    statTimeEl.textContent = fmtTime(sec);
  }

  function loadBest(){
    const v = localStorage.getItem(BEST_KEY);
    statBestEl.textContent = v ? v + '회' : '-';
    return v ? parseInt(v,10) : null;
  }

  function maybeSaveBest(moves){
    const cur = localStorage.getItem(BEST_KEY);
    if(cur === null || moves < parseInt(cur,10)){
      localStorage.setItem(BEST_KEY, String(moves));
      loadBest();
      return true;
    }
    return false;
  }

  function isSolved(){
    return grid.every(v => v === 0);
  }

  function onTap(i){
    if(ended) return;
    toggleAt(i, grid);
    movesUsed++;
    statMovesEl.textContent = movesUsed;
    paint();

    if(isSolved()){
      endGame();
    }
  }

  function endGame(){
    ended = true;
    clearInterval(timerId);
    const totalSec = Math.floor((Date.now()-startTime)/1000);

    const newBest = maybeSaveBest(movesUsed);
    resultSubEl.textContent = newBest ? '신기록이에요! 모든 조명을 껐어요.' : '모든 조명을 껐어요.';
    resMovesEl.textContent = movesUsed;
    resTimeEl.textContent = fmtTime(totalSec);

    setTimeout(() => overlayEl.classList.add('show'), 200);
  }

  function newGame(){
    ended = false;
    movesUsed = 0;
    statMovesEl.textContent = 0;
    grid = new Array(SIZE*SIZE).fill(0);

    // 정답(모두 꺼짐) 상태에서 무작위로 SCRAMBLE_MOVES 번 토글 -> 항상 풀이 가능
    let lastIdx = -1;
    for(let k=0;k<SCRAMBLE_MOVES;k++){
      let r;
      do { r = Math.floor(Math.random()*grid.length); } while(r === lastIdx);
      lastIdx = r;
      toggleAt(r, grid);
    }
    // 혹시 섞다가 우연히 풀린 상태로 돌아왔다면 한 번 더 흔들기
    if(isSolved()){
      toggleAt(Math.floor(Math.random()*grid.length), grid);
    }

    paint();
    overlayEl.classList.remove('show');

    startTime = Date.now();
    statTimeEl.textContent = '0:00';
    clearInterval(timerId);
    timerId = setInterval(tickTimer, 250);
  }

  retryBtn.addEventListener('click', newGame);
  reshuffleBtn.addEventListener('click', newGame);

  buildBoardDom();
  loadBest();
  newGame();
})();
</script>
</body>
</html>
