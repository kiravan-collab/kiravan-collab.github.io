<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>컬러 플러드 · 잉크를 번지게 하라</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#12141f;
    --bg-2:#1a1e30;
    --panel:#20243a;
    --panel-2:#262b45;
    --ink:#f2efe6;
    --ink-dim:#9aa1c0;
    --line:rgba(255,255,255,0.08);
    --accent:#33c9a3;
    --accent-2:#8b7bf7;
    --c0:#ff6b5b;
    --c1:#f4b740;
    --c2:#33c9a3;
    --c3:#8b7bf7;
    --c4:#f25c9e;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100svh;
    background:
      radial-gradient(circle at 15% 0%, #232849 0%, transparent 55%),
      radial-gradient(circle at 85% 100%, #241f3d 0%, transparent 55%),
      linear-gradient(180deg,var(--bg-1),var(--bg-2));
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:14px 12px calc(14px + env(safe-area-inset-bottom));
    overflow-x:hidden;
    -webkit-user-select:none; user-select:none;
    touch-action:manipulation;
  }

  .wrap{width:100%; max-width:440px; display:flex; flex-direction:column; gap:12px; align-items:center;}

  /* -------- ad slot (top) -------- */
  .ad-slot{
    width:100%;
    display:flex; align-items:center; justify-content:center;
    background:repeating-linear-gradient(135deg, rgba(255,255,255,0.03) 0 10px, rgba(255,255,255,0.015) 10px 20px);
    border:1px dashed rgba(255,255,255,0.18);
    border-radius:10px;
    color:var(--ink-dim);
    font-size:11px;
    letter-spacing:.04em;
  }
  .ad-slot.top{ min-height:50px; max-width:320px; margin:0 auto; }
  .ad-slot.result{ min-height:100px; margin-top:6px; }

  /* -------- header -------- */
  header{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .title{
    font-family:'Baloo 2', system-ui, sans-serif;
    font-weight:800;
    font-size:22px;
    letter-spacing:-0.01em;
    display:flex; align-items:center; gap:8px;
  }
  .title .dot{
    width:12px;height:12px;border-radius:40% 60% 55% 45%/50% 45% 55% 50%;
    background:linear-gradient(135deg,var(--c0),var(--c3));
    display:inline-block;
  }
  .stats{
    display:flex; gap:8px;
  }
  .stat{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:6px 10px;
    text-align:center;
    min-width:56px;
  }
  .stat .num{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:15px; line-height:1.1;}
  .stat .lbl{ font-size:9px; color:var(--ink-dim); letter-spacing:.03em; margin-top:1px;}

  /* -------- moves bar -------- */
  .movebar-wrap{ width:100%; }
  .movebar{
    width:100%; height:8px; border-radius:5px;
    background:var(--panel);
    overflow:hidden;
    border:1px solid var(--line);
  }
  .movebar-fill{
    height:100%;
    width:0%;
    border-radius:5px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    transition:width .35s ease, background .35s ease;
  }
  .movebar-fill.danger{ background:linear-gradient(90deg,#ff6b5b,#f25c9e); }

  /* -------- board -------- */
  .board-card{
    width:100%;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:18px;
    padding:12px;
    box-shadow:0 20px 40px -20px rgba(0,0,0,0.6);
  }
  #board{
    display:grid;
    width:100%;
    aspect-ratio:1/1;
    gap:3px;
    border-radius:10px;
    overflow:hidden;
  }
  .cell{
    width:100%; height:100%;
    transition:background-color .32s ease, transform .32s ease;
    will-change:background-color, transform;
  }
  .cell.pulse{ transform:scale(0.92); }

  /* -------- palette -------- */
  .palette{
    width:100%;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
  }
  .swatch{
    aspect-ratio:1/1;
    border:none;
    border-radius:40% 60% 55% 45%/50% 40% 60% 50%;
    box-shadow:0 6px 14px -6px rgba(0,0,0,0.55), inset 0 -3px 6px rgba(0,0,0,0.18);
    position:relative;
    cursor:pointer;
    transition:transform .15s ease, opacity .2s ease, box-shadow .15s ease;
  }
  .swatch:active{ transform:scale(0.9); }
  .swatch[disabled]{
    opacity:0.35;
    box-shadow:none;
    transform:scale(0.92);
    cursor:default;
  }
  .swatch.current::after{
    content:"";
    position:absolute; inset:-5px;
    border-radius:inherit;
    border:2px solid rgba(255,255,255,0.7);
  }

  .hint{
    color:var(--ink-dim);
    font-size:12px;
    text-align:center;
    line-height:1.5;
  }

  /* -------- modal -------- */
  .overlay{
    position:fixed; inset:0;
    background:rgba(10,11,20,0.72);
    backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    opacity:0; pointer-events:none;
    transition:opacity .25s ease;
    z-index:50;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .modal{
    width:100%; max-width:360px;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:20px;
    padding:22px 20px 18px;
    text-align:center;
    transform:translateY(12px) scale(0.98);
    transition:transform .25s ease;
  }
  .overlay.show .modal{ transform:translateY(0) scale(1); }
  .modal .big{
    font-family:'Baloo 2',sans-serif;
    font-weight:800;
    font-size:26px;
    margin-bottom:4px;
  }
  .modal .sub{ color:var(--ink-dim); font-size:13px; margin-bottom:16px;}
  .modal .row{
    display:flex; gap:8px; margin-bottom:6px;
  }
  .modal .box{
    flex:1;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:10px 6px;
  }
  .modal .box .num{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:18px;}
  .modal .box .lbl{ font-size:10px; color:var(--ink-dim); margin-top:2px;}
  .btn{
    margin-top:16px;
    width:100%;
    border:none;
    border-radius:14px;
    padding:14px;
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:16px;
    color:#0d1420;
    background:linear-gradient(135deg,var(--accent),#7be0c6);
    cursor:pointer;
    transition:transform .12s ease;
  }
  .btn:active{ transform:scale(0.97); }

  footer{ color:var(--ink-dim); font-size:11px; text-align:center; margin-top:2px; }
</style>
</head>
<body>

<div class="wrap">

  <!-- ============ 광고 영역 (상단 배너) ============ -->
  <!-- 실제 서비스 시 이 div 내부를 Google AdSense 등의 광고 스크립트로 교체하세요.
       예: <ins class="adsbygoogle" style="display:inline-block;width:320px;height:50px" ...></ins> -->
  <div class="ad-slot top">광고 영역 (320×50)</div>

  <header>
    <div class="title"><span class="dot"></span>컬러 플러드</div>
    <div class="stats">
      <div class="stat"><div class="num" id="statTime">0:00</div><div class="lbl">시간</div></div>
      <div class="stat"><div class="num" id="statBest">-</div><div class="lbl">최고기록</div></div>
    </div>
  </header>

  <div class="movebar-wrap">
    <div class="movebar"><div class="movebar-fill" id="moveFill"></div></div>
  </div>

  <div class="board-card">
    <div id="board"></div>
  </div>

  <div class="palette" id="palette"></div>

  <p class="hint">색을 눌러 왼쪽 위부터 보드 전체를 같은 색으로 물들이세요.<br>제한 이동 안에 끝내지 못하면 게임 오버!</p>

  <footer>한 판 1~3분 · 심심할 때 부담없이</footer>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="big" id="resultTitle">완료!</div>
    <div class="sub" id="resultSub">보드를 전부 물들였어요</div>
    <div class="row">
      <div class="box"><div class="num" id="resMoves">0</div><div class="lbl">사용한 이동</div></div>
      <div class="box"><div class="num" id="resTime">0:00</div><div class="lbl">걸린 시간</div></div>
    </div>

    <!-- ============ 광고 영역 (결과 화면, 인터스티셜 대체) ============ -->
    <!-- 결과 모달이 뜰 때마다 노출되는 자리입니다. 전면 광고(interstitial) 대신
         AdSense 디스플레이 광고 등을 넣기 좋은 위치입니다. -->
    <div class="ad-slot result">광고 영역 (결과 화면)</div>

    <button class="btn" id="retryBtn">다시 하기</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  // ---------- 설정 ----------
  const SIZE = 9;                 // 9x9 보드
  const COLORS = ['--c0','--c1','--c2','--c3','--c4'];
  const MOVE_LIMIT = 20;
  const BEST_KEY = 'colorflood_best_moves_v1';

  const root = document.documentElement;
  const cssColor = (i) => getComputedStyle(root).getPropertyValue(COLORS[i]).trim();

  // ---------- 상태 ----------
  let grid = [];          // color index per cell
  let region = new Set(); // indices currently in the flooded region
  let regionColor = 0;
  let movesUsed = 0;
  let startTime = 0;
  let timerId = null;
  let ended = false;

  const boardEl = document.getElementById('board');
  const paletteEl = document.getElementById('palette');
  const moveFillEl = document.getElementById('moveFill');
  const statTimeEl = document.getElementById('statTime');
  const statBestEl = document.getElementById('statBest');
  const overlayEl = document.getElementById('overlay');
  const resultTitleEl = document.getElementById('resultTitle');
  const resultSubEl = document.getElementById('resultSub');
  const resMovesEl = document.getElementById('resMoves');
  const resTimeEl = document.getElementById('resTime');
  const retryBtn = document.getElementById('retryBtn');

  const idx = (r,c) => r*SIZE + c;

  function neighbors(i){
    const r = Math.floor(i/SIZE), c = i % SIZE;
    const out = [];
    if(r>0) out.push(idx(r-1,c));
    if(r<SIZE-1) out.push(idx(r+1,c));
    if(c>0) out.push(idx(r,c-1));
    if(c<SIZE-1) out.push(idx(r,c+1));
    return out;
  }

  function randomGrid(){
    const g = new Array(SIZE*SIZE);
    for(let i=0;i<g.length;i++){ g[i] = Math.floor(Math.random()*COLORS.length); }
    return g;
  }

  function buildBoardDom(){
    boardEl.innerHTML = '';
    boardEl.style.gridTemplateColumns = `repeat(${SIZE}, 1fr)`;
    boardEl.style.gridTemplateRows = `repeat(${SIZE}, 1fr)`;
    for(let i=0;i<SIZE*SIZE;i++){
      const cell = document.createElement('div');
      cell.className = 'cell';
      const rvar = 6 + Math.floor(Math.random()*6);
      cell.style.borderRadius = `${rvar}% ${100-rvar}% ${rvar+10}% ${100-rvar-10}%/${rvar+8}% ${rvar}% ${100-rvar}% ${100-rvar-8}%`;
      boardEl.appendChild(cell);
    }
  }

  function buildPaletteDom(){
    paletteEl.innerHTML = '';
    COLORS.forEach((cssVar, i) => {
      const btn = document.createElement('button');
      btn.className = 'swatch';
      btn.style.background = `radial-gradient(circle at 32% 28%, rgba(255,255,255,0.35), transparent 55%), var(${cssVar})`;
      btn.addEventListener('click', () => onPick(i));
      paletteEl.appendChild(btn);
    });
  }

  function paintAll(){
    const cells = boardEl.children;
    for(let i=0;i<grid.length;i++){
      cells[i].style.backgroundColor = cssColor(grid[i]);
    }
    updatePaletteState();
  }

  function updatePaletteState(){
    const swatches = paletteEl.children;
    for(let i=0;i<swatches.length;i++){
      swatches[i].classList.toggle('current', i === regionColor);
      swatches[i].disabled = (i === regionColor);
    }
  }

  function updateMoveBar(){
    const pct = Math.min(100, (movesUsed / MOVE_LIMIT) * 100);
    moveFillEl.style.width = pct + '%';
    moveFillEl.classList.toggle('danger', movesUsed >= MOVE_LIMIT - 4);
  }

  function fmtTime(sec){
    const m = Math.floor(sec/60);
    const s = sec % 60;
    return m + ':' + String(s).padStart(2,'0');
  }

  function tickTimer(){
    if(ended) return;
    const sec = Math.floor((Date.now()-startTime)/1000);
    statTimeEl.textContent = fmtTime(sec);
  }

  function loadBest(){
    const v = localStorage.getItem(BEST_KEY);
    statBestEl.textContent = v ? v + '수' : '-';
    return v ? parseInt(v,10) : null;
  }

  function maybeSaveBest(moves){
    const cur = localStorage.getItem(BEST_KEY);
    if(cur === null || moves < parseInt(cur,10)){
      localStorage.setItem(BEST_KEY, String(moves));
      loadBest();
      return true;
    }
    return false;
  }

  // 새 색으로 채우기 + BFS 레이어별로 흡수, 잉크가 번지는 듯한 딜레이 적용
  function onPick(colorIndex){
    if(ended) return;
    if(colorIndex === regionColor) return;

    movesUsed++;

    const cells = boardEl.children;
    const visited = new Set(region);
    let frontier = Array.from(region);

    // 1) 기존 region 은 즉시 새 색으로
    frontier.forEach(i => {
      grid[i] = colorIndex;
      cells[i].style.transitionDelay = '0ms';
      cells[i].style.backgroundColor = cssColor(colorIndex);
      cells[i].classList.add('pulse');
      setTimeout(() => cells[i].classList.remove('pulse'), 180);
    });

    // 2) BFS 레이어로 확장
    let depth = 1;
    let current = frontier;
    while(current.length){
      const next = [];
      current.forEach(i => {
        neighbors(i).forEach(n => {
          if(!visited.has(n) && grid[n] === colorIndex){
            visited.add(n);
            next.push(n);
          }
        });
      });
      next.forEach(i => {
        cells[i].style.transitionDelay = (depth*45) + 'ms';
        cells[i].style.backgroundColor = cssColor(colorIndex);
        setTimeout(() => {
          cells[i].classList.add('pulse');
          setTimeout(() => cells[i].classList.remove('pulse'), 180);
        }, depth*45);
      });
      current = next;
      depth++;
    }

    region = visited;
    regionColor = colorIndex;

    updatePaletteState();
    updateMoveBar();

    // 판정
    if(region.size === grid.length){
      endGame(true);
    } else if(movesUsed >= MOVE_LIMIT){
      endGame(false);
    }
  }

  function endGame(won){
    ended = true;
    clearInterval(timerId);
    const totalSec = Math.floor((Date.now()-startTime)/1000);

    let newBest = false;
    if(won) newBest = maybeSaveBest(movesUsed);

    resultTitleEl.textContent = won ? '완성!' : '이동 초과';
    resultSubEl.textContent = won
      ? (newBest ? '신기록이에요! 보드를 전부 물들였어요.' : '보드를 전부 하나의 색으로 물들였어요.')
      : '제한 이동을 다 썼어요. 다시 도전해보세요.';
    resMovesEl.textContent = movesUsed + ' / ' + MOVE_LIMIT;
    resTimeEl.textContent = fmtTime(totalSec);

    setTimeout(() => overlayEl.classList.add('show'), 260);
  }

  function newGame(){
    ended = false;
    movesUsed = 0;
    grid = randomGrid();
    region = new Set([0]);
    regionColor = grid[0];

    // region 은 시작점과 색이 같은 인접 셀들까지 포함 (초기 확장)
    let frontier = [0];
    while(frontier.length){
      const next = [];
      frontier.forEach(i => {
        neighbors(i).forEach(n => {
          if(!region.has(n) && grid[n] === regionColor){
            region.add(n);
            next.push(n);
          }
        });
      });
      frontier = next;
    }

    buildBoardDom();
    paintAll();
    updateMoveBar();
    overlayEl.classList.remove('show');

    startTime = Date.now();
    statTimeEl.textContent = '0:00';
    clearInterval(timerId);
    timerId = setInterval(tickTimer, 250);
  }

  retryBtn.addEventListener('click', newGame);

  buildPaletteDom();
  loadBest();
  newGame();
})();
</script>
</body>
</html>
