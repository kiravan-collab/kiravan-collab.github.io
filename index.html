<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>미니게임 서랍 · 심심할 때 한 판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#12141f;
    --bg-2:#1a1e30;
    --panel:#20243a;
    --panel-2:#262b45;
    --ink:#f2efe6;
    --ink-dim:#9aa1c0;
    --ink-faint:#5c6284;
    --line:rgba(255,255,255,0.08);
    --accent:#33c9a3;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    height:100svh;
    background:
      radial-gradient(circle at 15% 0%, #232849 0%, transparent 55%),
      radial-gradient(circle at 85% 100%, #241f3d 0%, transparent 55%),
      linear-gradient(180deg,var(--bg-1),var(--bg-2));
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    overflow:hidden;
    -webkit-user-select:none; user-select:none;
    touch-action:manipulation;
  }

  .page{
    width:100%; max-width:520px;
    height:100%;
    display:flex; flex-direction:column;
    padding:14px 16px calc(10px + env(safe-area-inset-bottom));
  }

  /* -------- ad slot -------- */
  .ad-slot{
    width:100%; max-width:320px; margin:0 auto 10px;
    min-height:50px;
    display:flex; align-items:center; justify-content:center;
    background:repeating-linear-gradient(135deg, rgba(255,255,255,0.03) 0 10px, rgba(255,255,255,0.015) 10px 20px);
    border:1px dashed rgba(255,255,255,0.18);
    border-radius:10px;
    color:var(--ink-dim);
    font-size:11px;
    flex-shrink:0;
  }

  /* -------- header -------- */
  header{ flex-shrink:0; margin-bottom:14px; }
  .title{
    font-family:'Baloo 2', system-ui, sans-serif;
    font-weight:800;
    font-size:24px;
    letter-spacing:-0.01em;
    display:flex; align-items:center; gap:8px;
  }
  .title .dot{
    width:13px;height:13px;border-radius:40% 60% 55% 45%/50% 45% 55% 50%;
    background:linear-gradient(135deg,#ff6b5b,#8b7bf7);
    display:inline-block;
  }
  .subtitle{
    color:var(--ink-dim);
    font-size:12.5px;
    margin-top:4px;
  }
  .count-pill{
    display:inline-flex; align-items:center; gap:5px;
    margin-top:10px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:999px;
    padding:5px 12px;
    font-size:11.5px;
    color:var(--ink-dim);
  }
  .count-pill b{ color:var(--ink); font-family:'Baloo 2',sans-serif; }

  /* -------- scrollable grid -------- */
  .grid-scroll{
    flex:1;
    min-height:0;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding-bottom:6px;
    mask-image:linear-gradient(180deg, black 92%, transparent 100%);
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:12px;
  }
  @media (min-width:420px){
    .grid{ grid-template-columns:repeat(4, 1fr); }
  }

  .tile{
    display:flex; flex-direction:column; align-items:center;
    gap:8px;
    text-decoration:none;
    color:inherit;
  }
  .icon{
    width:100%;
    aspect-ratio:1/1;
    border-radius:26% 74% 68% 32%/38% 32% 68% 62%;
    display:flex; align-items:center; justify-content:center;
    font-size:26px;
    box-shadow:0 10px 20px -10px rgba(0,0,0,0.6), inset 0 -3px 8px rgba(0,0,0,0.15);
    transition:transform .15s ease;
    position:relative;
  }
  .tile:active .icon{ transform:scale(0.92); }
  .tile .label{
    font-size:11.5px;
    font-weight:600;
    text-align:center;
    line-height:1.25;
    color:var(--ink);
  }
  .tile .time{
    font-size:9.5px;
    color:var(--ink-dim);
  }

  /* empty / coming-soon placeholder tile */
  .tile.empty{ pointer-events:none; }
  .tile.empty .icon{
    background:transparent;
    border:1.5px dashed rgba(255,255,255,0.14);
    box-shadow:none;
    color:rgba(255,255,255,0.16);
    font-size:20px;
  }
  .tile.empty .label{ color:var(--ink-faint); }
  .tile.empty .time{ color:transparent; }

  footer{
    flex-shrink:0;
    text-align:center;
    color:var(--ink-faint);
    font-size:10.5px;
    padding-top:10px;
  }
</style>
</head>
<body>
<div class="page">

  <!-- ============ 광고 영역 (허브 상단 배너) ============ -->
  <!-- 실제 서비스 시 이 div 내부를 Google AdSense 등의 광고 스크립트로 교체하세요. -->
  <div class="ad-slot">광고 영역 (320×50)</div>

  <header>
    <div class="title"><span class="dot"></span>미니게임 서랍</div>
    <div class="subtitle">심심할 때 꺼내서 한 판, 부담 없이.</div>
    <div class="count-pill" id="countPill">게임 <b id="countNum">0</b>개 등록됨</div>
  </header>

  <div class="grid-scroll">
    <div class="grid" id="grid"></div>
  </div>

  <footer>새 게임이 계속 추가될 예정이에요</footer>
</div>

<script>
(function(){
  "use strict";

  /* ============================================================
     게임을 새로 배포할 때는 이 배열에 한 줄만 추가하면 됩니다.
     href 는 게임 폴더 경로 (예: 'color-flood/' 또는 'word-puzzle/')
     colors 는 아이콘 그라데이션에 쓰일 두 가지 색상
  ============================================================ */
  const GAMES = [
    {
      id: 'color-flood',
      title: '컬러 플러드',
      time: '1~3분',
      href: 'color-flood/',
      emoji: '🎨',
      colors: ['#ff6b5b', '#8b7bf7']
    },
    {
      id: 'lights-out',
      title: '라이트 아웃',
      time: '1~3분',
      href: 'lights-out/',
      emoji: '💡',
      colors: ['#ffc65c', '#ff8a5c']
    }
    // 다음 게임 예시:
    // {
    //   id: 'word-puzzle',
    //   title: '단어 퍼즐',
    //   time: '2~3분',
    //   href: 'word-puzzle/',
    //   emoji: '🔤',
    //   colors: ['#33c9a3', '#f4b740']
    // },
  ];

  const MIN_SLOTS = 8; // 게임이 적을 때 최소 이만큼은 빈 아이콘으로 채워서 보여줌

  const gridEl = document.getElementById('grid');
  const countNumEl = document.getElementById('countNum');

  countNumEl.textContent = GAMES.length;

  function renderGameTile(game){
    const a = document.createElement('a');
    a.className = 'tile';
    a.href = game.href;

    const icon = document.createElement('div');
    icon.className = 'icon';
    icon.style.background = `radial-gradient(circle at 32% 26%, rgba(255,255,255,0.35), transparent 55%), linear-gradient(135deg, ${game.colors[0]}, ${game.colors[1]})`;
    icon.textContent = game.emoji || '🎮';

    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = game.title;

    const time = document.createElement('div');
    time.className = 'time';
    time.textContent = game.time || '';

    a.appendChild(icon);
    a.appendChild(label);
    a.appendChild(time);
    return a;
  }

  function renderEmptyTile(){
    const d = document.createElement('div');
    d.className = 'tile empty';

    const icon = document.createElement('div');
    icon.className = 'icon';
    icon.textContent = '+';

    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = '준비중';

    const time = document.createElement('div');
    time.className = 'time';
    time.textContent = '-';

    d.appendChild(icon);
    d.appendChild(label);
    d.appendChild(time);
    return d;
  }

  function render(){
    gridEl.innerHTML = '';
    GAMES.forEach(g => gridEl.appendChild(renderGameTile(g)));

    const remain = Math.max(0, MIN_SLOTS - GAMES.length);
    for(let i=0;i<remain;i++){
      gridEl.appendChild(renderEmptyTile());
    }
  }

  render();
})();
</script>
</body>
</html>
