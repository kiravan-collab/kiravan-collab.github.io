<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7707074644859958" crossorigin="anonymous"></script>
<title>컬러 플러드 · 잉크를 번지게 하라</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#12141f;
    --bg-2:#1a1e30;
    --panel:#20243a;
    --panel-2:#262b45;
    --ink:#f2efe6;
    --ink-dim:#9aa1c0;
    --line:rgba(255,255,255,0.08);
    --accent:#33c9a3;
    --accent-2:#8b7bf7;
    --c0:#ff6b5b;
    --c1:#f4b740;
    --c2:#33c9a3;
    --c3:#8b7bf7;
    --c4:#f25c9e;
    --gold:#ffc65c;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100svh;
    background:
      radial-gradient(circle at 15% 0%, #232849 0%, transparent 55%),
      radial-gradient(circle at 85% 100%, #241f3d 0%, transparent 55%),
      linear-gradient(180deg,var(--bg-1),var(--bg-2));
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:14px 12px calc(14px + env(safe-area-inset-bottom));
    overflow-x:hidden;
    -webkit-user-select:none; user-select:none;
    touch-action:manipulation;
  }

  .wrap{width:100%; max-width:440px; display:flex; flex-direction:column; gap:12px; align-items:center;}

  .ad-slot{
    width:100%;
    display:flex; align-items:center; justify-content:center;
    background:repeating-linear-gradient(135deg, rgba(255,255,255,0.03) 0 10px, rgba(255,255,255,0.015) 10px 20px);
    border:1px dashed rgba(255,255,255,0.18);
    border-radius:10px;
    color:var(--ink-dim);
    font-size:11px;
    letter-spacing:.04em;
  }
  .ad-slot.top{ min-height:50px; max-width:320px; margin:0 auto; }
  /* 결과 화면 광고 — 버튼과 확실히 분리해 오클릭을 막습니다 */
  .ad-slot.result{
    min-height:100px; margin-top:22px; padding-top:14px;
    border-top:1px solid rgba(255,255,255,0.10);
  }

  header{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .left-group{ display:flex; align-items:center; gap:8px; }
  .home-btn{
    display:flex; align-items:center; justify-content:center;
    width:34px; height:34px;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--ink);
    border-radius:10px;
    font-size:15px;
    text-decoration:none;
    flex-shrink:0;
  }
  .home-btn:active{ transform:scale(0.94); }
  .title{
    font-family:'Baloo 2', system-ui, sans-serif;
    font-weight:800;
    font-size:22px;
    letter-spacing:-0.01em;
    display:flex; align-items:center; gap:8px;
  }
  .title .dot{
    width:12px;height:12px;border-radius:40% 60% 55% 45%/50% 45% 55% 50%;
    background:linear-gradient(135deg,var(--c0),var(--c3));
    display:inline-block;
  }
  .stats{
    display:flex; gap:8px;
  }
  .stat{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:6px 10px;
    text-align:center;
    min-width:56px;
  }
  .stat .num{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:15px; line-height:1.1;}
  .stat .lbl{ font-size:9px; color:var(--ink-dim); letter-spacing:.03em; margin-top:1px;}

  .rank-btn{
    display:flex; align-items:center; gap:5px;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--ink);
    border-radius:10px;
    padding:6px 11px;
    font-size:12px;
    font-weight:600;
    cursor:pointer;
  }
  .rank-btn:active{ transform:scale(0.96); }

  .movebar-wrap{ width:100%; }
  .movebar{
    width:100%; height:8px; border-radius:5px;
    background:var(--panel);
    overflow:hidden;
    border:1px solid var(--line);
  }
  .movebar-fill{
    height:100%;
    width:0%;
    border-radius:5px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    transition:width .35s ease, background .35s ease;
  }
  .movebar-fill.danger{ background:linear-gradient(90deg,#ff6b5b,#f25c9e); }

  .board-card{
    width:100%;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:18px;
    padding:12px;
    box-shadow:0 20px 40px -20px rgba(0,0,0,0.6);
  }
  #board{
    display:grid;
    width:100%;
    aspect-ratio:1/1;
    gap:3px;
    border-radius:10px;
    overflow:hidden;
  }
  .cell{
    width:100%; height:100%;
    transition:background-color .32s ease, transform .32s ease;
    will-change:background-color, transform;
  }
  .cell.pulse{ transform:scale(0.92); }

  .palette{
    width:100%;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
  }
  .swatch{
    aspect-ratio:1/1;
    border:none;
    border-radius:40% 60% 55% 45%/50% 40% 60% 50%;
    box-shadow:0 6px 14px -6px rgba(0,0,0,0.55), inset 0 -3px 6px rgba(0,0,0,0.18);
    position:relative;
    cursor:pointer;
    transition:transform .15s ease, opacity .2s ease, box-shadow .15s ease;
  }
  .swatch:active{ transform:scale(0.9); }
  .swatch[disabled]{
    opacity:0.35;
    box-shadow:none;
    transform:scale(0.92);
    cursor:default;
  }
  .swatch.current::after{
    content:"";
    position:absolute; inset:-5px;
    border-radius:inherit;
    border:2px solid rgba(255,255,255,0.7);
  }

  .hint{
    color:var(--ink-dim);
    font-size:12px;
    text-align:center;
    line-height:1.5;
  }

  .overlay{
    position:fixed; inset:0;
    background:rgba(10,11,20,0.72);
    backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    opacity:0; pointer-events:none;
    transition:opacity .25s ease;
    z-index:50;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .modal{
    width:100%; max-width:360px;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:20px;
    padding:22px 20px 18px;
    text-align:center;
    transform:translateY(12px) scale(0.98);
    transition:transform .25s ease;
    max-height:88vh;
    overflow-y:auto;
  }
  .overlay.show .modal{ transform:translateY(0) scale(1); }
  .modal .big{
    font-family:'Baloo 2',sans-serif;
    font-weight:800;
    font-size:26px;
    margin-bottom:4px;
  }
  .modal .sub{ color:var(--ink-dim); font-size:13px; margin-bottom:16px;}
  .modal .row{
    display:flex; gap:8px; margin-bottom:6px;
  }
  .modal .box{
    flex:1;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:10px 6px;
  }
  .modal .box .num{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:18px;}
  .modal .box .lbl{ font-size:10px; color:var(--ink-dim); margin-top:2px;}

  .rank-line{
    margin-top:10px;
    font-size:13px;
    color:var(--gold);
    font-weight:700;
    min-height:18px;
  }

  .btn{
    margin-top:16px;
    width:100%;
    border:none;
    border-radius:14px;
    padding:14px;
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:16px;
    color:#0d1420;
    background:linear-gradient(135deg,var(--accent),#7be0c6);
    cursor:pointer;
    transition:transform .12s ease;
  }
  .btn:active{ transform:scale(0.97); }
  .btn.secondary{
    background:var(--panel);
    color:var(--ink);
    border:1px solid var(--line);
  }

  .name-input{
    width:100%;
    margin-top:10px;
    padding:12px 14px;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--ink);
    font-size:15px;
    font-family:'Inter',sans-serif;
    text-align:center;
  }
  .name-input:focus{ outline:2px solid var(--accent); }

  .rank-list{
    margin-top:14px;
    text-align:left;
    display:flex;
    flex-direction:column;
    gap:6px;
    max-height:280px;
    overflow-y:auto;
  }
  .rank-row{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:8px 10px;
  }
  .rank-row.me{ border-color:var(--accent); background:rgba(51,201,163,0.12); }
  .rank-row .pos{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    width:22px;
    text-align:center;
    color:var(--ink-dim);
    flex-shrink:0;
  }
  .rank-row.top1 .pos{ color:#ffd76a; }
  .rank-row.top2 .pos{ color:#d9dbe6; }
  .rank-row.top3 .pos{ color:#e0a672; }
  .rank-row .rname{ flex:1; font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .rank-row .rpts{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:13px; color:var(--accent); }
  .rank-empty{ color:var(--ink-dim); font-size:12.5px; padding:14px 0; }
  .rank-loading{ color:var(--ink-dim); font-size:12.5px; padding:14px 0; }

  footer{ color:var(--ink-dim); font-size:11px; text-align:center; margin-top:2px; }
</style>
</head>
<body>

<div class="wrap">

  <!-- ============ 광고 영역 (상단 배너) ============ -->
  <div class="ad-slot top">광고 영역 (320×50)</div>

  <header>
    <div class="left-group">
      <a class="home-btn" href="../" title="미니게임 서랍으로">🏠</a>
      <div class="title"><span class="dot"></span>컬러 플러드</div>
    </div>
    <div style="display:flex; gap:6px; align-items:center;">
      <button class="rank-btn" id="rankOpenBtn">🏆 랭킹</button>
    </div>
  </header>

  <div style="width:100%; display:flex; gap:8px; justify-content:flex-end;">
    <div class="stat"><div class="num" id="statTime">0:00</div><div class="lbl">시간</div></div>
    <div class="stat"><div class="num" id="statBest">-</div><div class="lbl">최고기록</div></div>
  </div>

  <div class="movebar-wrap">
    <div class="movebar"><div class="movebar-fill" id="moveFill"></div></div>
  </div>

  <div class="board-card">
    <div id="board"></div>
  </div>

  <div class="palette" id="palette"></div>

  <p class="hint">색을 눌러 왼쪽 위부터 보드 전체를 같은 색으로 물들이세요.<br>제한 이동 안에 끝내지 못하면 게임 오버!</p>

  <footer>한 판 1~3분 · 심심할 때 부담없이</footer>
</div>

<!-- 결과 모달 -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="big" id="resultTitle">완료!</div>
    <div class="sub" id="resultSub">보드를 전부 물들였어요</div>
    <div class="row">
      <div class="box"><div class="num" id="resMoves">0</div><div class="lbl">사용한 이동</div></div>
      <div class="box"><div class="num" id="resTime">0:00</div><div class="lbl">걸린 시간</div></div>
    </div>
    <div class="rank-line" id="rankLine"></div>

    <button class="btn" id="retryBtn">다시 하기</button>
    <button class="btn secondary" id="viewRankFromResultBtn">🏆 전체 랭킹 보기</button>
    <!-- 광고는 버튼 아래에 — 게임오버 직후 버튼 연타로 인한 오클릭을 막습니다 -->
    <div class="ad-slot result">광고 영역 (결과 화면)</div>
  </div>
</div>

<!-- 닉네임 입력 모달 -->
<div class="overlay" id="nameOverlay">
  <div class="modal">
    <div class="big">닉네임을 정해주세요</div>
    <div class="sub">랭킹에 표시될 이름이에요 (최대 20자, 언제든 변경 가능)</div>
    <input type="text" id="nameInput" class="name-input" placeholder="예: 물감요정" maxlength="20">
    <button class="btn" id="nameSaveBtn">저장하고 랭킹 등록</button>
  </div>
</div>

<!-- 랭킹 모달 -->
<div class="overlay" id="rankOverlay">
  <div class="modal">
    <div class="big">🏆 컬러 플러드 랭킹</div>
    <div class="sub">이동 횟수와 시간이 좋을수록 점수가 높아요</div>
    <div class="rank-list" id="rankList"><div class="rank-loading">불러오는 중...</div></div>
    <button class="btn secondary" id="rankCloseBtn">닫기</button>
  </div>
</div>

<!-- Firebase (전체 방문자 공유 랭킹) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="../shared/firebase-config.js"></script>
<script src="../shared/leaderboard.js"></script>

<script>
(function(){
  "use strict";

  const GAME_ID = 'color-flood';
  const SIZE = 9;
  const COLORS = ['--c0','--c1','--c2','--c3','--c4'];
  const MOVE_LIMIT = 20;
  const BEST_KEY = 'colorflood_best_moves_v1';

  const root = document.documentElement;
  const cssColor = (i) => getComputedStyle(root).getPropertyValue(COLORS[i]).trim();

  let grid = [];
  let region = new Set();
  let regionColor = 0;
  let movesUsed = 0;
  let startTime = 0;
  let timerId = null;
  let ended = false;
  let pendingSubmitStats = null;

  const boardEl = document.getElementById('board');
  const paletteEl = document.getElementById('palette');
  const moveFillEl = document.getElementById('moveFill');
  const statTimeEl = document.getElementById('statTime');
  const statBestEl = document.getElementById('statBest');
  const overlayEl = document.getElementById('overlay');
  const resultTitleEl = document.getElementById('resultTitle');
  const resultSubEl = document.getElementById('resultSub');
  const resMovesEl = document.getElementById('resMoves');
  const resTimeEl = document.getElementById('resTime');
  const rankLineEl = document.getElementById('rankLine');
  const retryBtn = document.getElementById('retryBtn');

  const rankOpenBtn = document.getElementById('rankOpenBtn');
  const rankOverlayEl = document.getElementById('rankOverlay');
  const rankListEl = document.getElementById('rankList');
  const rankCloseBtn = document.getElementById('rankCloseBtn');
  const viewRankFromResultBtn = document.getElementById('viewRankFromResultBtn');

  const nameOverlayEl = document.getElementById('nameOverlay');
  const nameInputEl = document.getElementById('nameInput');
  const nameSaveBtn = document.getElementById('nameSaveBtn');

  const idx = (r,c) => r*SIZE + c;

  function neighbors(i){
    const r = Math.floor(i/SIZE), c = i % SIZE;
    const out = [];
    if(r>0) out.push(idx(r-1,c));
    if(r<SIZE-1) out.push(idx(r+1,c));
    if(c>0) out.push(idx(r,c-1));
    if(c<SIZE-1) out.push(idx(r,c+1));
    return out;
  }

  function randomGrid(){
    const g = new Array(SIZE*SIZE);
    for(let i=0;i<g.length;i++){ g[i] = Math.floor(Math.random()*COLORS.length); }
    return g;
  }

  function buildBoardDom(){
    boardEl.innerHTML = '';
    boardEl.style.gridTemplateColumns = `repeat(${SIZE}, 1fr)`;
    boardEl.style.gridTemplateRows = `repeat(${SIZE}, 1fr)`;
    for(let i=0;i<SIZE*SIZE;i++){
      const cell = document.createElement('div');
      cell.className = 'cell';
      const rvar = 6 + Math.floor(Math.random()*6);
      cell.style.borderRadius = `${rvar}% ${100-rvar}% ${rvar+10}% ${100-rvar-10}%/${rvar+8}% ${rvar}% ${100-rvar}% ${100-rvar-8}%`;
      boardEl.appendChild(cell);
    }
  }

  function buildPaletteDom(){
    paletteEl.innerHTML = '';
    COLORS.forEach((cssVar, i) => {
      const btn = document.createElement('button');
      btn.className = 'swatch';
      btn.style.background = `radial-gradient(circle at 32% 28%, rgba(255,255,255,0.35), transparent 55%), var(${cssVar})`;
      btn.addEventListener('click', () => onPick(i));
      paletteEl.appendChild(btn);
    });
  }

  function paintAll(){
    const cells = boardEl.children;
    for(let i=0;i<grid.length;i++){
      cells[i].style.backgroundColor = cssColor(grid[i]);
    }
    updatePaletteState();
  }

  function updatePaletteState(){
    const swatches = paletteEl.children;
    for(let i=0;i<swatches.length;i++){
      swatches[i].classList.toggle('current', i === regionColor);
      swatches[i].disabled = (i === regionColor);
    }
  }

  function updateMoveBar(){
    const pct = Math.min(100, (movesUsed / MOVE_LIMIT) * 100);
    moveFillEl.style.width = pct + '%';
    moveFillEl.classList.toggle('danger', movesUsed >= MOVE_LIMIT - 4);
  }

  function fmtTime(sec){
    const m = Math.floor(sec/60);
    const s = sec % 60;
    return m + ':' + String(s).padStart(2,'0');
  }

  function tickTimer(){
    if(ended) return;
    const sec = Math.floor((Date.now()-startTime)/1000);
    statTimeEl.textContent = fmtTime(sec);
  }

  function loadBest(){
    const v = localStorage.getItem(BEST_KEY);
    statBestEl.textContent = v ? v + '수' : '-';
    return v ? parseInt(v,10) : null;
  }

  function maybeSaveBest(moves){
    const cur = localStorage.getItem(BEST_KEY);
    if(cur === null || moves < parseInt(cur,10)){
      localStorage.setItem(BEST_KEY, String(moves));
      loadBest();
      return true;
    }
    return false;
  }

  function onPick(colorIndex){
    if(ended) return;
    if(colorIndex === regionColor) return;

    movesUsed++;

    const cells = boardEl.children;
    const visited = new Set(region);
    let frontier = Array.from(region);

    frontier.forEach(i => {
      grid[i] = colorIndex;
      cells[i].style.transitionDelay = '0ms';
      cells[i].style.backgroundColor = cssColor(colorIndex);
      cells[i].classList.add('pulse');
      setTimeout(() => cells[i].classList.remove('pulse'), 180);
    });

    let depth = 1;
    let current = frontier;
    while(current.length){
      const next = [];
      current.forEach(i => {
        neighbors(i).forEach(n => {
          if(!visited.has(n) && grid[n] === colorIndex){
            visited.add(n);
            next.push(n);
          }
        });
      });
      next.forEach(i => {
        cells[i].style.transitionDelay = (depth*45) + 'ms';
        cells[i].style.backgroundColor = cssColor(colorIndex);
        setTimeout(() => {
          cells[i].classList.add('pulse');
          setTimeout(() => cells[i].classList.remove('pulse'), 180);
        }, depth*45);
      });
      current = next;
      depth++;
    }

    region = visited;
    regionColor = colorIndex;

    updatePaletteState();
    updateMoveBar();

    if(region.size === grid.length){
      endGame(true);
    } else if(movesUsed >= MOVE_LIMIT){
      endGame(false);
    }
  }

  function endGame(won){
    ended = true;
    clearInterval(timerId);
    const totalSec = Math.floor((Date.now()-startTime)/1000);

    let newBest = false;
    if(won) newBest = maybeSaveBest(movesUsed);

    resultTitleEl.textContent = won ? '완성!' : '이동 초과';
    resultSubEl.textContent = won
      ? (newBest ? '신기록이에요! 보드를 전부 물들였어요.' : '보드를 전부 하나의 색으로 물들였어요.')
      : '제한 이동을 다 썼어요. 다시 도전해보세요.';
    resMovesEl.textContent = movesUsed + ' / ' + MOVE_LIMIT;
    resTimeEl.textContent = fmtTime(totalSec);
    rankLineEl.textContent = '';

    setTimeout(() => overlayEl.classList.add('show'), 260);

    if(won && window.MiniGameLeaderboard){
      pendingSubmitStats = { moves: movesUsed, timeSec: totalSec };
      if(!window.MiniGameLeaderboard.getPlayerName()){
        setTimeout(() => nameOverlayEl.classList.add('show'), 500);
      } else {
        submitCurrentScore();
      }
    }
  }

  async function submitCurrentScore(){
    if(!pendingSubmitStats || !window.MiniGameLeaderboard) return;
    rankLineEl.textContent = '랭킹에 등록하는 중...';
    try{
      const res = await window.MiniGameLeaderboard.submitScore(GAME_ID, pendingSubmitStats);
      rankLineEl.textContent = '전체 ' + res.rank + '위! (' + res.points + '점)';
    }catch(e){
      rankLineEl.textContent = '랭킹 등록에 실패했어요 (연결 확인 필요)';
      console.error(e);
    }
    pendingSubmitStats = null;
  }

  nameSaveBtn.addEventListener('click', () => {
    const name = window.MiniGameLeaderboard.setPlayerName(nameInputEl.value);
    if(!name){ nameInputEl.focus(); return; }
    nameOverlayEl.classList.remove('show');
    submitCurrentScore();
  });

  async function openRanking(){
    rankOverlayEl.classList.add('show');
    rankListEl.innerHTML = '<div class="rank-loading">불러오는 중...</div>';
    if(!window.MiniGameLeaderboard){
      rankListEl.innerHTML = '<div class="rank-empty">랭킹 서버에 연결할 수 없어요.</div>';
      return;
    }
    try{
      const list = await window.MiniGameLeaderboard.fetchTopScores(GAME_ID, 10);
      const myId = window.MiniGameLeaderboard.getPlayerId();
      if(list.length === 0){
        rankListEl.innerHTML = '<div class="rank-empty">아직 등록된 기록이 없어요. 첫 기록의 주인공이 되어보세요!</div>';
        return;
      }
      rankListEl.innerHTML = '';
      list.forEach((row, i) => {
        const div = document.createElement('div');
        div.className = 'rank-row' + (row.id === myId ? ' me' : '') + (i===0?' top1':i===1?' top2':i===2?' top3':'');
        div.innerHTML = `<div class="pos">${i+1}</div><div class="rname">${escapeHtml(row.name || '익명')}</div><div class="rpts">${row.points}점</div>`;
        rankListEl.appendChild(div);
      });
    }catch(e){
      rankListEl.innerHTML = '<div class="rank-empty">랭킹을 불러오지 못했어요.</div>';
      console.error(e);
    }
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  rankOpenBtn.addEventListener('click', openRanking);
  viewRankFromResultBtn.addEventListener('click', () => { overlayEl.classList.remove('show'); openRanking(); });
  rankCloseBtn.addEventListener('click', () => rankOverlayEl.classList.remove('show'));

  function newGame(){
    ended = false;
    movesUsed = 0;
    grid = randomGrid();
    region = new Set([0]);
    regionColor = grid[0];

    let frontier = [0];
    while(frontier.length){
      const next = [];
      frontier.forEach(i => {
        neighbors(i).forEach(n => {
          if(!region.has(n) && grid[n] === regionColor){
            region.add(n);
            next.push(n);
          }
        });
      });
      frontier = next;
    }

    buildBoardDom();
    paintAll();
    updateMoveBar();
    overlayEl.classList.remove('show');

    startTime = Date.now();
    statTimeEl.textContent = '0:00';
    clearInterval(timerId);
    timerId = setInterval(tickTimer, 250);
  }

  retryBtn.addEventListener('click', newGame);

  buildPaletteDom();
  loadBest();
  newGame();
})();
</script>
</body>
</html>
